services:
  mysql:
    image: mysql:8.4
    container_name: image-be-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-image_be}
      MYSQL_USER: ${MYSQL_USER:-image_be}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      # MySQL 8.4 는 mysql_native_password 를 기본 비활성화한다. 이 플러그인을
      # 지원하지 않는 GUI 클라이언트(DB 확장 등)의 접속을 위해 로컬 개발에서만 켠다.
      - --mysql-native-password=ON
    volumes:
      # 데이터는 named volume에만 저장한다. 윈도우 폴더로 바인드 마운트하면
      # 파일시스템 변환 때문에 성능이 크게 떨어지고 권한 오류가 발생한다.
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-devroot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 컨테이너 안에서는 DB 주소가 127.0.0.1 이 아니라 서비스 이름이다.
      # pydantic-settings 는 실제 환경변수를 .env 파일보다 우선하므로,
      # 호스트 실행용 .env 를 그대로 두고도 양쪽이 함께 동작한다.
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-image_be}:${MYSQL_PASSWORD:-devpass}@mysql:3306/${MYSQL_DATABASE:-image_be}?charset=utf8mb4
      SQL_ECHO: ${SQL_ECHO:-false}
      TZ: Asia/Seoul
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/workspaces/IMAGE_BE
      # 컨테이너를 다시 만들어도 패키지를 매번 내려받지 않도록 캐시를 남긴다.
      - uv-cache:/opt/uv-cache
    working_dir: /workspaces/IMAGE_BE
    command: uv run --frozen fastapi dev main.py --host 0.0.0.0 --port 8000

volumes:
  mysql-data:
  uv-cache:
