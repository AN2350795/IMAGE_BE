[project]
name = "image-be"
version = "0.1.0"
description = "Secret Backend Project"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy",
    "pymysql",
    # PyMySQL 이 MySQL 8 의 caching_sha2_password 인증에 사용한다.
    "cryptography",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    # starlette 의 TestClient 가 httpx 대신 httpx2 를 쓰도록 바뀌었다.
    "httpx2",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI 는 Depends() 를 기본 인자로 두는 것이 정상 패턴이다.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 저장소를 패키지로 설치하지 않으므로 app 을 임포트할 수 있게 루트를 경로에 넣는다.
pythonpath = ["."]
