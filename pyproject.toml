[project]
name = "image-be"
version = "0.1.0"
description = "Secret Backend Project"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy",
    "pymysql",
    # PyMySQL 이 MySQL 8 의 caching_sha2_password 인증에 사용한다.
    "cryptography",
    "pydantic-settings",
    "alembic>=1.19.0",
    "cachetools>=7.1.7",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI 는 Depends() 를 기본 인자로 두는 것이 정상 패턴이다.
ignore = ["B008"]

